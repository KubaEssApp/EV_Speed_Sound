<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>EVDriveSound v7</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#07090d;--panel:#0d1117;--line:#202938;--text:#f6f8fb;--muted:#8d99a8;
  --accent:#63e6ff;--accent2:#9f7cff;--ok:#56e39f;--launch:#ffbd59;--danger:#ff6277;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior:none}
button,input{font:inherit}
.app{
  width:100vw;height:100vh;max-width:100vw;max-height:100vh;overflow:hidden;
  padding:6px 8px;display:grid;grid-template-rows:38px minmax(0,1fr) 48px;gap:6px;
  background:radial-gradient(650px 260px at 48% -90px,rgba(99,230,255,.13),transparent 66%),
  linear-gradient(180deg,#090c11,#06080b)
}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 10px;border:1px solid var(--line);
border-radius:12px;background:rgba(13,17,23,.95);min-width:0}
.brand{min-width:0;font-size:16px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:9px;color:var(--muted);margin-left:7px;font-weight:750}
.gpsStatus{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-weight:850;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#68717d}.dot.ok{background:var(--ok);box-shadow:0 0 9px rgba(86,227,159,.6)}
.main{min-height:0;min-width:0;overflow:hidden;display:grid;
grid-template-columns:minmax(135px,19%) minmax(210px,1fr) minmax(210px,35%);gap:6px}
.panel{min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;
background:rgba(13,17,23,.96);padding:8px}
.left{display:grid;grid-template-rows:auto 1fr auto;align-items:start}
.speedline{display:flex;align-items:flex-end;gap:5px;min-width:0}
.speed{font-size:clamp(44px,5.7vw,72px);font-weight:950;line-height:.86;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.unit{font-size:12px;color:var(--muted);font-weight:850;padding-bottom:4px}
.state{align-self:center;font-size:clamp(18px,2vw,25px);font-weight:950;letter-spacing:.04em}
.state.boost{color:#76eaff}.state.regen{color:#a48cff}.state.cruise{color:#62df9b}.state.launch{color:var(--launch)}
.metrics{font-size:9px;color:var(--muted)}.mrow{display:flex;justify-content:space-between;gap:5px;margin-top:4px;white-space:nowrap}
.loadbar{height:7px;border-radius:999px;background:#1b2230;margin-top:4px;overflow:hidden}
.loadfill{height:100%;width:50%;background:linear-gradient(90deg,#a48cff,#63e6ff)}
.center{position:relative;display:flex;align-items:center;justify-content:center}
.core{
  width:min(30vh,190px);height:min(30vh,190px);min-width:110px;min-height:110px;border-radius:50%;
  border:4px solid rgba(99,230,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(99,230,255,.21),rgba(159,124,255,.08) 50%,transparent 72%);
  box-shadow:0 0 24px rgba(99,230,255,.2),inset 0 0 20px rgba(99,230,255,.1);
  transition:transform .06s linear,box-shadow .06s linear
}
.core strong{font-size:clamp(19px,2.5vw,31px);font-weight:950;letter-spacing:.04em}
.core small{font-size:8px;color:var(--muted);letter-spacing:.14em;margin-top:3px}
.gear{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted);font-weight:950}
.profile{position:absolute;left:10px;bottom:8px;max-width:75%;font-size:9px;color:var(--muted);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soundpanel{display:grid;grid-template-rows:14px minmax(0,1fr);gap:5px}
.title{font-size:9px;letter-spacing:.15em;color:var(--muted);font-weight:900;line-height:14px;padding-left:1px}
.sounds{min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;
grid-template-rows:repeat(5,minmax(0,1fr));gap:4px}
.sound{min-width:0;min-height:0;overflow:hidden;border:1px solid #293445;border-radius:9px;
background:#111722;color:#edf3f8;padding:4px 6px;text-align:left;font-size:9px;font-weight:900;line-height:1.05;
white-space:nowrap;text-overflow:ellipsis}
.sound small{display:block;margin-top:2px;font-size:7px;color:#7f8b9c;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sound.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(99,230,255,.17),rgba(159,124,255,.16));
box-shadow:inset 0 0 0 1px rgba(99,230,255,.12)}
.bottom{min-height:0;display:grid;grid-template-columns:86px 105px minmax(160px,1fr) minmax(140px,22%);gap:6px}
.control{min-width:0;min-height:0;border:1px solid #2a3545;border-radius:12px;background:#111722;color:white;
font-weight:900;font-size:10px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.control.primary{border:none;color:#071015;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.control.running{color:white;background:linear-gradient(135deg,#ff667e,#ff9b62)}
.volbox{min-width:0;min-height:0;border:1px solid var(--line);border-radius:12px;background:#0d1117;padding:4px 8px;
display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;font-size:9px;color:var(--muted)}
input[type=range]{width:100%;min-width:0;accent-color:#63e6ff}
@media(max-height:470px){
  .app{grid-template-rows:34px minmax(0,1fr) 42px;padding:5px 6px;gap:5px}
  .panel{padding:6px;border-radius:11px}.brand{font-size:14px}.brand span{display:none}
  .core{width:min(27vh,155px);height:min(27vh,155px)}
  .sound{font-size:8px;padding:2px 4px}.sound small{display:none}.title{font-size:8px}
  .speed{font-size:clamp(39px,5.1vw,61px)}
}
@media(max-width:800px){
  .main{grid-template-columns:minmax(120px,19%) minmax(185px,1fr) minmax(190px,36%)}
  .bottom{grid-template-columns:76px 94px minmax(135px,1fr) minmax(125px,23%)}
  .sound{font-size:8px}
}
@media(max-width:650px){
  .main{grid-template-columns:125px minmax(170px,1fr) 175px}
  .sound small{display:none}.profile{display:none}
  .gpsStatus span:last-child{max-width:88px;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">EVDriveSound <span>v7 · DRIVING VIEW</span></div>
  <div class="gpsStatus"><span id="gpsDot" class="dot"></span><span id="gpsText">GPS nicht verbunden</span></div>
</header>
<main class="main">
  <section class="panel left">
    <div><div class="speedline"><span id="speed" class="speed">0</span><span class="unit">km/h</span></div></div>
    <div id="state" class="state">READY</div>
    <div class="metrics">
      <div class="mrow"><span>LAST</span><span id="g">0.00 g</span></div>
      <div class="loadbar"><div id="loadfill" class="loadfill"></div></div>
      <div class="mrow"><span id="rpm">0 V-RPM</span><span id="acc">— m GPS</span></div>
    </div>
  </section>

  <section class="panel center">
    <div id="gear" class="gear">G1</div>
    <div id="core" class="core"><strong id="coreText">IDLE</strong><small>DRIVE CORE</small></div>
    <div id="profileLabel" class="profile">Neon Surge</div>
  </section>

  <section class="panel soundpanel">
    <div class="title">SOUND PROFILES</div>
    <div class="sounds">
      <button class="sound active" data-p="neon">NEON SURGE<small>electric swell</small></button>
      <button class="sound" data-p="hover">HOVER 86<small>retro hover</small></button>
      <button class="sound" data-p="turbine">TURBINE X<small>jet spool</small></button>
      <button class="sound" data-p="whistle">HYPER WHISTLE<small>speed scream</small></button>
      <button class="sound" data-p="v8">EIGHT-PULSE<small>deep pulse</small></button>
      <button class="sound" data-p="reactor">REACTOR CORE<small>dark sci-fi</small></button>
      <button class="sound" data-p="ion">ION STORM<small>plasma drive</small></button>
      <button class="sound" data-p="phantom">PHANTOM TORQUE<small>stealth growl</small></button>
      <button class="sound" data-p="zen">ZEN HUM<small>smooth EV</small></button>
      <button class="sound" data-p="arc">ARC DRIVE<small>electric crackle</small></button>
    </div>
  </section>
</main>

<footer class="bottom">
  <button id="gpsBtn" class="control">GPS</button>
  <button id="testBtn" class="control">LAUNCH TEST</button>
  <button id="startBtn" class="control primary">START SOUND</button>
  <div class="volbox"><span>VOL</span><input id="volume" type="range" min="0" max="100" value="72"></div>
</footer>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
let watchId=null,lastT=null,lastV=null,speed=0,gRaw=0,gFilt=0,accuracy=0;
let ctx,master,engine=null,running=false,profile="neon";
let virtualRPM=700,lastGear=1,lastShiftT=0,lastBoost=false,testTimer=null;

const names={neon:"Neon Surge",hover:"Hover 86",turbine:"Turbine X",whistle:"Hyper Whistle",v8:"Eight-Pulse",
reactor:"Reactor Core",ion:"Ion Storm",phantom:"Phantom Torque",zen:"Zen Hum",arc:"Arc Drive"};

function audioInit(){
  if(ctx)return;
  ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
  master=ctx.createGain();
  master.gain.value=+$("volume").value/100*.62;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=18;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.12;
  master.connect(comp).connect(ctx.destination);
}
function makeOsc(type,f,g,out){
  const osc=ctx.createOscillator(),gn=ctx.createGain();
  osc.type=type;osc.frequency.value=f;gn.gain.value=g;osc.connect(gn).connect(out);osc.start();return{osc,gn};
}
function makeNoise(out,g=.03,freq=900,type="bandpass"){
  const b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ctx.createBufferSource(),fil=ctx.createBiquadFilter(),gn=ctx.createGain();
  src.buffer=b;src.loop=true;fil.type=type;fil.frequency.value=freq;gn.gain.value=g;
  src.connect(fil).connect(gn).connect(out);src.start();return{src,fil,gn};
}
function stopEngine(){
  if(!engine)return;
  const e=engine;engine=null;
  try{e.out.gain.setTargetAtTime(.0001,ctx.currentTime,.025)}catch{}
  setTimeout(()=>{try{e.nodes.forEach(x=>x.stop&&x.stop())}catch{}},140);
}
function build(){
  audioInit();stopEngine();
  const out=ctx.createGain();out.gain.value=.56;out.connect(master);
  let e={kind:profile,out,nodes:[]},a,b,c,noise;
  if(profile==="neon"){a=makeOsc("sine",90,.22,out);b=makeOsc("triangle",180,.10,out);c=makeOsc("sine",760,.018,out)}
  if(profile==="hover"){a=makeOsc("square",50,.15,out);b=makeOsc("triangle",100,.12,out);c=makeOsc("sine",315,.03,out)}
  if(profile==="turbine"){a=makeOsc("sine",110,.18,out);b=makeOsc("sawtooth",220,.045,out);noise=makeNoise(out,.045,1100)}
  if(profile==="whistle"){a=makeOsc("sine",150,.17,out);b=makeOsc("sine",980,.025,out);c=makeOsc("triangle",300,.065,out)}
  if(profile==="v8"){a=makeOsc("sawtooth",38,.22,out);b=makeOsc("square",76,.06,out);c=makeOsc("triangle",152,.04,out)}
  if(profile==="reactor"){a=makeOsc("triangle",42,.21,out);b=makeOsc("sine",84,.11,out);c=makeOsc("sine",520,.022,out)}
  if(profile==="ion"){a=makeOsc("sine",120,.18,out);b=makeOsc("triangle",360,.06,out);c=makeOsc("sine",1450,.015,out);noise=makeNoise(out,.02,1800)}
  if(profile==="phantom"){a=makeOsc("triangle",32,.24,out);b=makeOsc("sine",64,.09,out);c=makeOsc("sawtooth",128,.025,out)}
  if(profile==="zen"){a=makeOsc("sine",54,.19,out);b=makeOsc("sine",108,.06,out)}
  if(profile==="arc"){a=makeOsc("sawtooth",72,.13,out);b=makeOsc("square",216,.035,out);noise=makeNoise(out,.035,2400,"highpass")}
  [a,b,c].forEach(x=>{if(x)e.nodes.push(x.osc)});
  if(noise)e.nodes.push(noise.src);
  e.a=a;e.b=b;e.c=c;e.noise=noise;engine=e;
}
function shiftClick(){
  if(!ctx||!running)return;
  const osc=ctx.createOscillator(),gn=ctx.createGain();
  osc.type="square";osc.frequency.value=150;gn.gain.value=.03;osc.connect(gn).connect(master);
  const t=ctx.currentTime;gn.gain.setValueAtTime(.03,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.055);
  osc.start(t);osc.stop(t+.065);
}
function whoosh(strength){
  if(!ctx||!running||strength<=0)return;
  const b=ctx.createBuffer(1,ctx.sampleRate*.16,ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=b;f.type="highpass";f.frequency.value=900;g.gain.value=.07*strength;
  src.connect(f).connect(g).connect(master);src.start();
}
function gearFor(v){if(v<25)return 1;if(v<50)return 2;if(v<80)return 3;if(v<115)return 4;if(v<155)return 5;return 6}
function updateSound(){
  if(!engine||!running)return;
  const t=ctx.currentTime,boost=Math.min(1.2,Math.max(0,gFilt/.42)),regen=Math.min(1,Math.max(0,-gFilt/.30));
  const gear=gearFor(speed);
  if(gear!==lastGear&&performance.now()-lastShiftT>400){lastGear=gear;lastShiftT=performance.now();shiftClick();whoosh(.55)}
  $("gear").textContent="G"+gear;
  const gearDrop=1-(gear-1)*.055;
  virtualRPM=Math.max(650,(850+speed*62+boost*2900)*gearDrop);
  const norm=Math.min(1.4,virtualRPM/10500),e=engine;
  const set=(x,val,tau=.025)=>x&&x.osc.frequency.setTargetAtTime(val,t,tau);
  if(e.kind==="neon"){set(e.a,88+norm*340);set(e.b,176+norm*680);set(e.c,720+norm*1800,.02)}
  if(e.kind==="hover"){set(e.a,48+norm*120,.035);set(e.b,96+norm*240,.03);set(e.c,310+norm*610,.03)}
  if(e.kind==="turbine"){set(e.a,105+norm*520,.035);set(e.b,210+norm*980,.03);if(e.noise)e.noise.fil.frequency.setTargetAtTime(900+norm*3000,t,.03)}
  if(e.kind==="whistle"){set(e.a,145+norm*590,.03);set(e.b,900+norm*2900,.018);set(e.c,290+norm*1050,.025)}
  if(e.kind==="v8"){set(e.a,36+norm*160,.02);set(e.b,72+norm*320,.02);set(e.c,144+norm*640,.02)}
  if(e.kind==="reactor"){set(e.a,40+norm*120,.035);set(e.b,80+norm*240,.03);set(e.c,500+norm*980,.025)}
  if(e.kind==="ion"){set(e.a,115+norm*420,.02);set(e.b,345+norm*950,.02);set(e.c,1350+norm*2400,.018);if(e.noise)e.noise.fil.frequency.setTargetAtTime(1400+norm*3000,t,.02)}
  if(e.kind==="phantom"){set(e.a,30+norm*90,.04);set(e.b,60+norm*180,.04);set(e.c,120+norm*360,.035)}
  if(e.kind==="zen"){set(e.a,52+norm*85,.06);set(e.b,104+norm*170,.06)}
  if(e.kind==="arc"){set(e.a,70+norm*270,.022);set(e.b,210+norm*820,.02);if(e.noise)e.noise.fil.frequency.setTargetAtTime(1800+norm*3800,t,.018)}
  e.out.gain.setTargetAtTime(Math.max(.26,.45+boost*.27-regen*.12),t,.028);
  const isBoost=boost>.45;
  if(isBoost&&!lastBoost)whoosh(Math.min(1,boost));
  lastBoost=isBoost;
}
function onPos(p){
  const v=(typeof p.coords.speed==="number"&&isFinite(p.coords.speed)&&p.coords.speed>=0)?p.coords.speed:null;
  accuracy=p.coords.accuracy||0;
  if(v===null){$("gpsText").textContent="GPS ohne Speed";return}
  const now=p.timestamp||Date.now();speed=v*3.6;
  if(lastT!==null){
    const dt=(now-lastT)/1000;
    if(dt>.08&&dt<5){
      let raw=(v-lastV)/dt/9.80665;raw=Math.max(-1.1,Math.min(1.1,raw));
      const alpha=Math.abs(raw)>Math.abs(gFilt)?.46:.23;
      gFilt+=(raw-gFilt)*alpha;gRaw=raw;
    }
  }
  lastT=now;lastV=v;$("gpsDot").classList.add("ok");$("gpsText").textContent="GPS verbunden";
}
function startGps(){
  if(!navigator.geolocation){$("gpsText").textContent="GPS API fehlt";return}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(onPos,()=>{$("gpsText").textContent="GPS Fehler";$("gpsDot").classList.remove("ok")},
  {enableHighAccuracy:true,maximumAge:0,timeout:10000});
}
function setProfile(p){
  profile=p;$("profileLabel").textContent=names[p];
  document.querySelectorAll(".sound").forEach(b=>b.classList.toggle("active",b.dataset.p===p));
  if(running)build();
}
document.querySelectorAll(".sound").forEach(b=>b.onclick=()=>setProfile(b.dataset.p));
$("gpsBtn").onclick=startGps;
$("volume").oninput=()=>{if(ctx&&master)master.gain.setTargetAtTime(+$("volume").value/100*.62,ctx.currentTime,.02)};
$("startBtn").onclick=async()=>{
  audioInit();if(ctx.state==="suspended")await ctx.resume();
  running=!running;
  if(running){build();$("startBtn").textContent="STOP SOUND";$("startBtn").classList.add("running")}
  else{stopEngine();$("startBtn").textContent="START SOUND";$("startBtn").classList.remove("running")}
};
$("testBtn").onclick=async()=>{
  audioInit();if(ctx.state==="suspended")await ctx.resume();
  if(!running){running=true;build();$("startBtn").textContent="STOP SOUND";$("startBtn").classList.add("running")}
  clearInterval(testTimer);let t=0;speed=0;gFilt=0;
  testTimer=setInterval(()=>{
    t+=.05;
    if(t<1.8){gFilt=.36;speed+=2.4}
    else if(t<2.2){gFilt=.05;speed+=.5}
    else if(t<2.5){gFilt=.34;speed+=1.8}
    else if(t<4.6){gFilt=.18;speed+=1.0}
    else if(t<6.2){gFilt=-.18;speed=Math.max(0,speed-1.6)}
    else{clearInterval(testTimer);testTimer=null;gFilt=0;speed=0}
  },50);
};
function render(){
  let st="CRUISE",cls="cruise",core="CRUISE";
  if(speed<2&&Math.abs(gFilt)<.03){st="READY";cls="";core="IDLE"}
  else if(speed<8&&gFilt>.16){st="LAUNCH";cls="launch";core="LAUNCH"}
  else if(gFilt>.07){st="BOOST";cls="boost";core="BOOST"}
  else if(gFilt<-.06){st="REGEN";cls="regen";core="REGEN"}
  $("speed").textContent=Math.round(speed);
  $("state").textContent=st;$("state").className="state "+cls;$("coreText").textContent=core;
  $("g").textContent=(gFilt>=0?"+":"")+gFilt.toFixed(2)+" g";
  $("acc").textContent=accuracy?Math.round(accuracy)+" m GPS":"— m GPS";
  $("rpm").textContent=Math.round(virtualRPM/50)*50+" V-RPM";
  const load=Math.max(-1,Math.min(1,gFilt/.45));$("loadfill").style.width=(50+load*50)+"%";
  const pulse=1+Math.max(0,gFilt)*.28;$("core").style.transform="scale("+pulse+")";
  $("core").style.boxShadow="0 0 "+(24+Math.max(0,gFilt)*80)+"px rgba(99,230,255,.25), inset 0 0 20px rgba(99,230,255,.10)";
  updateSound();requestAnimationFrame(render);
}
requestAnimationFrame(render);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
})();
</script>
</body>
</html>
